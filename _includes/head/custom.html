<!-- Verdant theme runtime (System/Light/Dark). Synchronous so a saved choice
     applies before first paint. Generated from @sustainablewebsites/verdant-design
     by `npm run verdant`. The inline shim carries over a choice saved by the
     old masthead toggle, which used the "theme" storage key. -->
<script>
try {
  var legacy = localStorage.getItem('theme');
  if (legacy === 'light' || legacy === 'dark') {
    if (!localStorage.getItem('verdant-theme-preference')) localStorage.setItem('verdant-theme-preference', legacy);
    localStorage.removeItem('theme');
  }
} catch (e) {}
</script>
<script src="{{ '/assets/js/verdant-theme-toggle.js' | relative_url }}"></script>

  gtag('config', 'G-JHRSYNPYSF');
</script>

     the explicit choice when the reader picks Light or Dark. -->
<meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15140f" media="(prefers-color-scheme: dark)">
